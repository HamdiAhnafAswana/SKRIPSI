<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NetCrimp — Simulasi Instalasi &amp; Pengkabelan Jaringan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf0f7;--fg:#13202f;--muted:#57687b;--card:#fff;--line:#cfd9e5;--accent:#0b7bb5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a121d;--fg:#e6eef7;--muted:#93a6ba;--card:#111d2c;--line:#22344a;--accent:#38bdf8}}
:root[data-theme="dark"]{--bg:#0a121d;--fg:#e6eef7;--muted:#93a6ba;--card:#111d2c;--line:#22344a;--accent:#38bdf8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:12px 12px 20px}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600;font-size:19px;margin:0;letter-spacing:.2px}
h1 small{display:block;font-family:'Nunito',system-ui,sans-serif;font-weight:600;font-size:12.5px;color:var(--muted);letter-spacing:0}
.who{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--muted)}
.who input{font:inherit;font-weight:700;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:210px;max-width:52vw}
.who input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
canvas{display:block;width:100%;height:auto;aspect-ratio:960/600;border-radius:14px;border:1px solid var(--line);background:#0c1726;touch-action:none;user-select:none;-webkit-user-select:none}
.note{margin:10px 2px 0;font-size:13px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>NetCrimp<small>Game edukasi instalasi &amp; pengkabelan jaringan untuk siswa SMK TKJ</small></h1>
<label class="who">Nama siswa <input id="nama" type="text" maxlength="30" placeholder="Isi sebelum bermain" autocomplete="off"></label>
</header>
<canvas id="c" width="960" height="600" aria-label="Area permainan NetCrimp"></canvas>
<p class="note">Kontrol: seret dan lepas dengan mouse atau sentuhan. Progres dan log hasil tersimpan di browser ini.</p>
</div>
<script>
(() => {
'use strict';
const W = 960, H = 600;
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
const FONT_H = '"Fredoka","Nunito",system-ui,sans-serif', FONT_B = '"Nunito",system-ui,sans-serif';
const C = { panel: '#182a40', panel2: '#20364f', line: '#33506f', text: '#eaf2fb', mute: '#9db2c8', acc: '#38bdf8', ok: '#34d399', bad: '#f87171', warn: '#fbbf24', gold: '#d4a72c' };

/* ---------- penyimpanan ---------- */
const KEY = 'netcrimp_v1';
let save = { unlocked: 1, stars: [0,0,0,0,0], best: [0,0,0,0,0], log: [], teacher: false, board: [], board2: [], badges: [], l2: {} };
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && Array.isArray(s.stars)) save = Object.assign(save, s); } catch (e) {}
if (!Array.isArray(save.board2)) save.board2 = [];
if (!Array.isArray(save.badges)) save.badges = [];
if (!save.l2 || typeof save.l2 !== 'object') save.l2 = {};
if (!save.l2.grafis) save.l2.grafis = (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) || /Android|iPhone|iPad/i.test(navigator.userAgent) ? 'hemat' : 'normal';
if (typeof save.l2.mudah !== 'boolean') save.l2.mudah = false;
if (typeof save.l2.sound !== 'boolean') save.l2.sound = true;
function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }
const nameEl = document.getElementById('nama');
try { nameEl.value = localStorage.getItem(KEY + '_nama') || ''; } catch (e) {}
nameEl.addEventListener('input', () => { try { localStorage.setItem(KEY + '_nama', nameEl.value); } catch (e) {} });

/* ---------- suara ---------- */
const SND = {
    ctx: null,
    on() { return save.l2.sound !== false; },
    boot() { if (this.ctx) return; try { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; this.ctx = new AC(); } catch (e) { this.ctx = null; } },
    tone(f, dur, type, vol, f2) {
        if (!this.on()) return; this.boot(); const c = this.ctx; if (!c) return;
        if (c.state === 'suspended') { try { c.resume(); } catch (e) {} }
        const o = c.createOscillator(), g = c.createGain();
        o.type = type || 'sine'; o.frequency.setValueAtTime(f, c.currentTime);
        if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(40, f2), c.currentTime + dur);
        g.gain.setValueAtTime(0.0001, c.currentTime);
        g.gain.exponentialRampToValueAtTime(vol == null ? .12 : vol, c.currentTime + .012);
        g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + dur);
        o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + dur + .02);
    },
    noise(dur, vol, hp) {
        if (!this.on()) return; this.boot(); const c = this.ctx; if (!c) return;
        if (c.state === 'suspended') { try { c.resume(); } catch (e) {} }
        const n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
        const s = c.createBufferSource(); s.buffer = buf;
        const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 900;
        const g = c.createGain(); g.gain.value = vol == null ? .16 : vol;
        s.connect(f); f.connect(g); g.connect(c.destination); s.start();
    },
    potong() { this.noise(.14, .22, 1400); this.tone(180, .1, 'square', .05, 90); },
    kupas() { this.noise(.30, .14, 2200); this.tone(520, .16, 'sawtooth', .03, 260); },
    crimp() { this.noise(.07, .30, 2600); this.tone(120, .09, 'square', .14, 60); },
    klik() { this.tone(880, .05, 'triangle', .08); },
    benar() { this.tone(660, .10, 'sine', .12); setTimeout(() => this.tone(990, .16, 'sine', .12), 90); },
    salah() { this.tone(220, .20, 'sawtooth', .10, 120); }
};

/* ---------- pemuat Three.js ---------- */
const THREE_URL = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
const threeState = { status: 'new', waiters: [] };
function webglOK() { try { const c = document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl'))); } catch (e) { return false; } }
function loadThree(cb) {
    if (window.THREE && window.THREE.WebGLRenderer) { cb(null); return; }
    threeState.waiters.push(cb);
    if (threeState.status === 'loading' || threeState.status === 'ok') return;
    threeState.status = 'loading';
    const s = document.createElement('script'); let done = false;
    const finish = err => { if (done) return; done = true; clearTimeout(timer); threeState.status = err ? 'fail' : 'ok'; const list = threeState.waiters.slice(); threeState.waiters.length = 0; list.forEach(f => f(err || null)); };
    const timer = setTimeout(() => finish(new Error('timeout')), 11000);
    s.src = THREE_URL; s.async = true;
    s.onload = () => finish(window.THREE && window.THREE.WebGLRenderer ? null : new Error('no-three'));
    s.onerror = () => finish(new Error('network'));
    document.head.appendChild(s);
}

/* ---------- kanvas ---------- */
function fit() { const r = cv.getBoundingClientRect(); const d = Math.min(window.devicePixelRatio || 1, 2); cv.width = Math.max(1, Math.round(r.width * d)); cv.height = Math.max(1, Math.round(r.width * H / W * d)); }
window.addEventListener('resize', fit); fit();

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function txt(s, x, y, o) { o = o || {}; ctx.font = `${o.w || 700} ${o.s || 16}px ${o.f || FONT_B}`; ctx.fillStyle = o.c || C.text; ctx.textAlign = o.a || 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText(String(s), x, y); }
function wrapLines(s, maxW, size, weight) { ctx.font = `${weight || 600} ${size}px ${FONT_B}`; const out = []; for (const p of String(s).split('\n')) { let line = ''; for (const w of p.split(' ')) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; } out.push(line); } return out; }
function para(s, x, y, maxW, lh, o) { o = Object.assign({ w: 600, s: 14 }, o || {}); const L = wrapLines(s, maxW, o.s, o.w); L.forEach((l, i) => txt(l, x, y + i * lh, o)); return L.length; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }
const fmt = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const inR = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- input & tombol ---------- */
let mouse = { x: -1, y: -1 }, btns = [], hoverBtn = false, scene = null, toast = null, shake = 0;
const over = (x, y, w, h) => mouse.x >= x && mouse.x <= x + w && mouse.y >= y && mouse.y <= y + h;
function hit(x, y, w, h, fn) { btns.push({ x, y, w, h, fn }); }
function btn(x, y, w, h, label, fn, o) {
    o = o || {}; const dis = !!o.disabled; const hov = !dis && over(x, y, w, h); if (hov) hoverBtn = true;
    rr(x, y, w, h, o.r || 10); ctx.fillStyle = dis ? '#22344a' : (o.color || C.acc); ctx.fill();
    if (hov) { rr(x, y, w, h, o.r || 10); ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fill(); }
    txt(label, x + w / 2, y + h / 2 + (o.s || 16) * 0.35, { s: o.s || 16, a: 'center', w: 800, c: dis ? '#5f7389' : (o.tc || '#06131f') });
    if (!dis) hit(x, y, w, h, fn);
}
function say(msg, kind) { toast = { msg, kind: kind || 'info', t: performance.now() }; }
function drawToast() {
    if (!toast) return; const age = performance.now() - toast.t; if (age > 4600) { toast = null; return; }
    const col = toast.kind === 'bad' ? C.bad : toast.kind === 'ok' ? C.ok : C.acc;
    const L = wrapLines(toast.msg, 690, 15, 700); const w = 740, h = L.length * 20 + 16, x = (W - w) / 2, y = H - h - 8;
    ctx.save(); ctx.globalAlpha = age > 4100 ? Math.max(0, (4600 - age) / 500) : 1;
    rr(x, y, w, h, 10); ctx.fillStyle = 'rgba(6,14,26,.95)'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = col; ctx.stroke();
    L.forEach((l, i) => txt(l, x + w / 2, y + 24 + i * 20, { s: 15, a: 'center', c: C.text }));
    ctx.restore();
}
function P(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
cv.addEventListener('pointerdown', e => {
    e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    mouse = P(e);
    for (let i = btns.length - 1; i >= 0; i--) { const b = btns[i]; if (inR(mouse, b)) { b.fn(); return; } }
    if (scene.down) scene.down(mouse);
});
cv.addEventListener('pointermove', e => { mouse = P(e); if (scene.move) scene.move(mouse); });
function endPtr(e) { mouse = P(e); if (scene.up) scene.up(mouse); if (e.pointerType === 'touch') mouse = { x: -1, y: -1 }; }
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);

/* ---------- gambar umum ---------- */
function bg(wires) {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#13233a'); g.addColorStop(1, '#0b1523'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(120,160,210,.06)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = 0; x <= W; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, H); } for (let y = 0; y <= H; y += 40) { ctx.moveTo(0, y); ctx.lineTo(W, y); } ctx.stroke();
    if (wires) {
        const t = performance.now() / 1000; ctx.lineCap = 'round';
        for (let k = 0; k < 8; k++) {
            ctx.beginPath(); for (let x = -10; x <= W + 10; x += 14) { const y = 505 + k * 8 + Math.sin(x / 95 + t * 1.1 + k * .45) * 11; if (x < 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
            const id = T568B[k], d = WC[id]; ctx.lineWidth = 5; ctx.strokeStyle = d.c; ctx.setLineDash(d.st ? [10, 8] : []); ctx.stroke();
            ctx.setLineDash([]);
        }
    }
}
function deskBG() {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#14253c'); g.addColorStop(1, '#0b1523'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(120,160,210,.06)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = 0; x <= W; x += 40) { ctx.moveTo(x, 54); ctx.lineTo(x, H); } for (let y = 54; y <= H; y += 40) { ctx.moveTo(0, y); ctx.lineTo(W, y); } ctx.stroke();
}
function tickIcon(x, y, s, c) { ctx.save(); ctx.beginPath(); ctx.moveTo(x - s * .5, y); ctx.lineTo(x - s * .15, y + s * .4); ctx.lineTo(x + s * .55, y - s * .4); ctx.strokeStyle = c; ctx.lineWidth = Math.max(2, s * .22); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(); ctx.restore(); }
function crossIcon(x, y, s, c) { ctx.save(); ctx.beginPath(); ctx.moveTo(x - s * .4, y - s * .4); ctx.lineTo(x + s * .4, y + s * .4); ctx.moveTo(x + s * .4, y - s * .4); ctx.lineTo(x - s * .4, y + s * .4); ctx.strokeStyle = c; ctx.lineWidth = Math.max(2, s * .22); ctx.lineCap = 'round'; ctx.stroke(); ctx.restore(); }
function star(cx, cy, r, on) { ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * .45 : r; ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad); } ctx.closePath(); ctx.fillStyle = on ? C.warn : '#2a3a4e'; ctx.fill(); ctx.strokeStyle = on ? '#b7791f' : '#3a4d64'; ctx.lineWidth = 1.5; ctx.stroke(); }
function lock(x, y, s) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.lineWidth = 5; ctx.strokeStyle = '#4b6079'; ctx.beginPath(); ctx.arc(0, -8, 11, Math.PI, 0); ctx.stroke(); rr(-16, -8, 32, 26, 5); ctx.fillStyle = '#4b6079'; ctx.fill(); ctx.restore(); }

/* ---------- warna kabel ---------- */
const WC = {
    wo: { n: 'Putih-Oranye', c: '#f97316', st: 1 }, o: { n: 'Oranye', c: '#f97316' },
    wg: { n: 'Putih-Hijau', c: '#16a34a', st: 1 }, b: { n: 'Biru', c: '#2563eb' },
    wb: { n: 'Putih-Biru', c: '#2563eb', st: 1 }, g: { n: 'Hijau', c: '#16a34a' },
    wbr: { n: 'Putih-Coklat', c: '#8b5a2b', st: 1 }, br: { n: 'Coklat', c: '#8b5a2b' },
    sarung_tangan: { n: 'Sarung Tangan', c: '#dc2626', st: 0 }
};
const T568B = ['wo', 'o', 'wg', 'b', 'wb', 'g', 'wbr', 'br'];
const T568A = ['wg', 'g', 'wo', 'b', 'wb', 'o', 'wbr', 'br'];
function drawWire(x, y, w, h, id, hz) {
    const d = WC[id], r = Math.min(w, h) / 2.4;
    rr(x, y, w, h, r); ctx.fillStyle = d.st ? '#f2f2ee' : d.c; ctx.fill();
    if (d.st) {
        ctx.save(); rr(x, y, w, h, r); ctx.clip(); ctx.fillStyle = d.c; const L = hz ? w : h, n = 6, b = L / n;
        for (let k = 0; k < n; k += 2) { if (hz) ctx.fillRect(x + k * b + b * .25, y - 1, b, h + 2); else ctx.fillRect(x - 1, y + k * b + b * .25, w + 2, b); } ctx.restore();
    }
    rr(x, y, w, h, r); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.stroke();
}

/* ---------- ikon alat ---------- */
function icon(id, x, y, s) {
    s = s || 1; ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    switch (id) {
        case 'utp':
            for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.ellipse(0, 0, 34 - i * 7, 22 - i * 5, 0, 0, 6.3); ctx.lineWidth = 6; ctx.strokeStyle = i % 2 ? '#2563eb' : '#60a5fa'; ctx.stroke(); }
            ctx.beginPath(); ctx.moveTo(30, 8); ctx.bezierCurveTo(44, 24, 52, 10, 58, 20); ctx.lineWidth = 5; ctx.strokeStyle = '#60a5fa'; ctx.stroke(); break;
        case 'utp_out':
            ctx.beginPath(); ctx.ellipse(0, 0, 40, 28, 0, 0, 6.3); ctx.fillStyle = '#0a0a0a'; ctx.fill();
            ctx.beginPath(); ctx.ellipse(0, 0, 36, 24, 0, 0, 6.3); ctx.lineWidth = 3; ctx.strokeStyle = '#1f2937'; ctx.stroke();
            for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.ellipse(-3, 0, 26 - i * 5, 17 - i * 4, 0, 0, 6.3); ctx.lineWidth = 4; ctx.strokeStyle = i % 2 ? '#2563eb' : '#60a5fa'; ctx.stroke(); }
            ctx.beginPath(); ctx.moveTo(28, 10); ctx.bezierCurveTo(40, 24, 50, 12, 56, 22); ctx.lineWidth = 4; ctx.strokeStyle = '#1f2937'; ctx.stroke();
            ctx.beginPath(); ctx.arc(30, -22, 8, 0, 6.3); ctx.fillStyle = '#38bdf8'; ctx.fill();
            ctx.beginPath(); ctx.moveTo(30, -26); ctx.lineTo(30, -20); ctx.lineTo(34, -18); ctx.strokeStyle = '#082f49'; ctx.lineWidth = 2; ctx.stroke(); break;
        case 'utp_in':
            for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.ellipse(-3, 0, 32 - i * 7, 21 - i * 5, 0, 0, 6.3); ctx.lineWidth = 5; ctx.strokeStyle = i % 2 ? '#2563eb' : '#60a5fa'; ctx.stroke(); }
            ctx.beginPath(); ctx.moveTo(26, 8); ctx.bezierCurveTo(40, 22, 48, 10, 54, 18); ctx.lineWidth = 4; ctx.strokeStyle = '#60a5fa'; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(24, -26); ctx.lineTo(40, -26); ctx.lineTo(32, -8); ctx.closePath();
            ctx.fillStyle = '#fbbf24'; ctx.fill(); ctx.strokeStyle = '#92400e'; ctx.lineWidth = 1.5; ctx.stroke();
            txt('!', 32, -14, { s: 14, a: 'center', c: '#1a1200', w: 800 }); break;
        case 'rj45':
            rr(-22, -14, 44, 32, 4); ctx.fillStyle = 'rgba(210,232,245,.92)'; ctx.fill(); ctx.strokeStyle = '#7aa0b8'; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = C.gold; for (let k = 0; k < 8; k++)ctx.fillRect(-18 + k * 5, -12, 3, 12);
            rr(-10, 18, 20, 8, 2); ctx.fillStyle = 'rgba(210,232,245,.92)'; ctx.fill(); break;
        case 'crimp':
            ctx.lineWidth = 9; ctx.strokeStyle = '#dc2626'; ctx.beginPath(); ctx.moveTo(-26, 28); ctx.lineTo(-6, -4); ctx.moveTo(26, 28); ctx.lineTo(6, -4); ctx.stroke();
            rr(-16, -26, 32, 24, 5); ctx.fillStyle = '#9aa8b8'; ctx.fill(); ctx.strokeStyle = '#5b6b7d'; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = '#3b4757'; ctx.fillRect(-9, -20, 18, 8); break;
        case 'strip':
            ctx.lineWidth = 8; ctx.strokeStyle = '#eab308'; ctx.beginPath(); ctx.moveTo(-24, 28); ctx.lineTo(-2, -2); ctx.moveTo(24, 28); ctx.lineTo(2, -2); ctx.stroke();
            ctx.fillStyle = '#cbd5e1'; ctx.beginPath(); ctx.moveTo(-10, -2); ctx.lineTo(-3, -28); ctx.lineTo(4, -2); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#94a3b8'; ctx.beginPath(); ctx.moveTo(10, -2); ctx.lineTo(3, -28); ctx.lineTo(-4, -2); ctx.closePath(); ctx.fill(); break;
        case 'tester':
            rr(-36, -20, 72, 40, 6); ctx.fillStyle = '#166534'; ctx.fill(); ctx.strokeStyle = '#0b3b1f'; ctx.lineWidth = 2; ctx.stroke();
            for (let k = 0; k < 8; k++) { ctx.beginPath(); ctx.arc(-28 + k * 8, -8, 3, 0, 6.3); ctx.fillStyle = k % 3 ? '#4ade80' : '#fde047'; ctx.fill(); }
            ctx.fillStyle = '#0b1220'; ctx.fillRect(-22, 4, 16, 10); ctx.fillRect(6, 4, 16, 10); break;
        case 'obeng':
            rr(-38, -8, 30, 16, 6); ctx.fillStyle = '#f97316'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#94a3b8'; ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(38, 0); ctx.stroke(); break;
        case 'solder':
            rr(-38, -9, 32, 18, 6); ctx.fillStyle = '#374151'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = '#94a3b8'; ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(26, 0); ctx.stroke();

/* ---------- level dasar, HUD, kuis ---------- */
function baseLevel(n, title) {
    const lv = { n, title, score: 100, mistakes: [], t0: performance.now(), phase: 'play', finished: false, delay: 1300, dur: 0, finAt: 0, idx: n - 1 };
    lv.elapsed = () => (performance.now() - lv.t0) / 1000;
    lv.penalize = (p, msg) => { lv.score = Math.max(0, lv.score - p); lv.mistakes.push(msg); say(msg + ' (−' + p + ')', 'bad'); shake = 10; };
    lv.win = d => { if (lv.phase === 'fin') return; lv.phase = 'fin'; lv.finAt = performance.now(); lv.delay = d || 1300; lv.dur = Math.round(lv.elapsed()); };
    lv.tick = () => { if (lv.phase === 'fin' && !lv.finished && performance.now() - lv.finAt > lv.delay) { lv.finished = true; endLevel(lv, true); } };
    return lv;
}
function hud(lv) {
    ctx.fillStyle = '#08111e'; ctx.fillRect(0, 0, W, 54); ctx.fillStyle = C.line; ctx.fillRect(0, 53, W, 1);
    txt('Level ' + lv.n, 18, 35, { s: 22, f: FONT_H, c: C.acc, w: 600 });
    txt(lv.title, 112, 34, { s: 15, c: C.text });
    btn(W - 92, 10, 78, 34, 'Menu', () => go(levelsScene), { color: '#334155', tc: C.text, s: 14 });
    txt('Skor', W - 112, 22, { s: 11, c: C.mute, a: 'right' });
    txt(lv.score, W - 112, 46, { s: 22, f: FONT_H, c: C.warn, a: 'right', w: 600 });
    const t = lv.phase === 'fin' ? lv.dur : lv.elapsed();
    let lab, col = C.text;
    if (lv.limit) { const left = Math.max(0, lv.limit - t); lab = fmt(left); if (left < 30) col = C.bad; } else lab = fmt(t);
    txt(lv.limit ? 'Sisa waktu' : 'Waktu', W - 192, 22, { s: 11, c: C.mute, a: 'right' });
    txt(lab, W - 192, 46, { s: 22, f: FONT_H, c: col, a: 'right', w: 600 });
}
function drawQuiz(lv) {
    btns.length = 0;
    ctx.fillStyle = 'rgba(4,10,20,.8)'; ctx.fillRect(0, 54, W, H - 54);
    const x = 170, y = 130, w = 620, h = 350;
    rr(x, y, w, h, 18); ctx.fillStyle = C.panel; ctx.fill(); ctx.strokeStyle = C.acc; ctx.lineWidth = 2; ctx.stroke();
    const quizzes = lv.quizzes || (lv.quiz ? [lv.quiz] : []);
    const q = quizzes[lv.quizIdx || 0];
    if (!q) return;
    txt('Pertanyaan ' + ((lv.quizIdx || 0) + 1) + ' dari ' + quizzes.length, x + w / 2, y + 40, { s: 24, f: FONT_H, c: C.acc, a: 'center', w: 600 });
    para(q.q, x + w / 2, y + 80, w - 70, 24, { s: 17, a: 'center', c: C.text, w: 700 });
    const fin = lv.phase === 'fin';
    q.opts.forEach((o, i) => {
        const by = y + 150 + i * 58; const right = i === q.ans;
        let color = '#2b4360', tc = C.text, dis = fin;
        if (lv.wrongPicks.includes(i)) { color = '#5b2530'; tc = '#f5b5bd'; dis = true; }
        if (fin && right) { color = C.ok; tc = '#04160f'; }
        btn(x + 30, by, w - 60, 46, o, () => quizPick(lv, i), { color, tc, disabled: false, s: 15 });
        if (dis) { btns.pop(); }
    });
}
function quizPick(lv, i) {
    if (lv.phase !== 'quiz' && lv.phase !== 'fin') return;
    const quizzes = lv.quizzes || (lv.quiz ? [lv.quiz] : []);
    const q = quizzes[lv.quizIdx || 0];
    if (!q) return;
    if (i === q.ans) {
        say('Benar. ' + q.why, 'ok');
        lv.quizIdx = (lv.quizIdx || 0) + 1;
        lv.wrongPicks = [];
        if (lv.quizIdx >= quizzes.length) lv.win(2400);
    } else { lv.wrongPicks.push(i); lv.penalize(10, 'Jawaban kuis kurang tepat'); }
}

/* ---------- akhir level, hasil, log ---------- */
function endLevel(lv, ok) {
    if (!lv.dur) lv.dur = Math.round(lv.elapsed());
    const stars = ok ? (lv.score >= 85 ? 3 : lv.score >= 60 ? 2 : 1) : 0;
    const i = lv.n - 1;
    const isNewBest = ok && lv.score > (save.best[i] || 0);
    if (ok) {
        save.stars[i] = Math.max(save.stars[i] || 0, stars);
        save.best[i] = Math.max(save.best[i] || 0, lv.score);
        save.unlocked = Math.max(save.unlocked, Math.min(5, lv.n + 1));
        const nm = (nameEl.value || '(tanpa nama)').trim() || '(tanpa nama)';
        const bk = lv.boardKey || 'board';
        if (!Array.isArray(save[bk])) save[bk] = [];
        save[bk].push({ nama: nm, skor: lv.score, waktu: lv.dur, ts: Date.now() });
        save[bk].sort((a, b) => b.skor - a.skor || a.waktu - b.waktu);
        save[bk] = save[bk].slice(0, 10);
    }
    const extra = lv.logExtra || {};
    save.log.push(Object.assign({
        ts: Date.now(), nama: (nameEl.value || '(tanpa nama)').trim() || '(tanpa nama)', level: lv.n, skor: lv.score,
        bintang: stars, durasi: lv.dur, salah: lv.mistakes.length, hasil: ok ? 'Lulus' : 'Gagal'
    }, { kabel_cm: 0, rj45: 0, bantuan: 0, lencana: '' }, extra));
    if (save.log.length > 300) save.log.shift();
    persist();
    go((lv.makeResult || resultScene)(lv, ok, stars, isNewBest));
}
function resultScene(lv, ok, stars, isNewBest) {
    return {
        draw() {
            bg(false);
            const x = 250, y = 70, w = 460, h = 460;
            rr(x, y, w, h, 20); ctx.fillStyle = C.panel; ctx.fill(); ctx.strokeStyle = ok ? C.ok : C.bad; ctx.lineWidth = 2; ctx.stroke();
            txt(ok ? 'Level selesai' : 'Waktu habis', W / 2, y + 54, { s: 34, f: FONT_H, a: 'center', c: ok ? C.ok : C.bad, w: 600 });
            txt('Level ' + lv.n + ' · ' + lv.title, W / 2, y + 82, { s: 14, a: 'center', c: C.mute });
            if (isNewBest) txt('REKOR BARU!', W / 2, y + 108, { s: 18, f: FONT_H, a: 'center', c: C.warn, w: 600 });
            for (let i = 0; i < 3; i++)star(W / 2 - 56 + i * 56, y + 132, 22, i < stars);
            txt(lv.score, W / 2, y + 210, { s: 60, f: FONT_H, a: 'center', c: C.warn, w: 600 });
            txt('skor akhir', W / 2, y + 232, { s: 13, a: 'center', c: C.mute });
            txt('Waktu ' + fmt(lv.dur) + '   ·   Kesalahan ' + lv.mistakes.length, W / 2, y + 262, { s: 15, a: 'center' });
            if (ok && lv.n === 1) {
                const pos = save.board.findIndex(e => e.skor === lv.score && e.waktu === lv.dur);
                if (pos >= 0 && pos < 10) txt('Peringkat #' + (pos + 1) + ' di papan skor Level 1', W / 2, y + 286, { s: 14, a: 'center', c: C.acc, w: 700 });
            }
            if (lv.mistakes.length) {
                txt('Catatan kesalahan:', x + 30, y + 300, { s: 13, c: C.mute });
                lv.mistakes.slice(0, 3).forEach((m, i) => { const l = wrapLines(m, w - 60, 12, 600)[0]; txt('• ' + (l.length < m.length && wrapLines(m, w - 60, 12, 600).length > 1 ? l + ' …' : l), x + 30, y + 320 + i * 18, { s: 12, w: 600, c: C.text }); });
            } else txt(ok ? 'Tanpa kesalahan. Kerja bagus!' : 'Coba lagi, kamu pasti bisa.', x + 30, y + 308, { s: 14, c: C.ok });
            const by = y + 380;
            btn(x + 30, by, 130, 46, 'Ulangi', () => startLevel(lv.idx), { color: '#334155', tc: C.text });
            if (ok && lv.n < 5) btn(x + 175, by, 255, 46, 'Lanjut ke level ' + (lv.n + 1), () => startLevel(lv.n), { color: C.ok });
            else btn(x + 175, by, 255, 46, 'Pilih level', () => go(levelsScene), { color: C.acc });
            if (ok && lv.n === 5) txt('Semua level selesai. Selamat!', W / 2, y + 446, { s: 14, a: 'center', c: C.warn });
        }
    };
}

    const wireMats = {}, _texCache = new Map();

    function stripeTexture(hex) {
        if (_texCache.has(hex)) return _texCache.get(hex);
        const c = document.createElement('canvas'); c.width = c.height = 32;
        const g = c.getContext('2d'); g.fillStyle = '#f2f2ee'; g.fillRect(0,0,32,32);
        g.strokeStyle = hex; g.lineWidth = 9;
        for (let i=-32;i<64;i+=13){g.beginPath();g.moveTo(i,32);g.lineTo(i+32,0);g.stroke();}
        const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 2);
        _texCache.set(hex, t); return t;
    }
    function wireMaterial(id) {
        if (wireMats[id]) return wireMats[id];
        const d = WC[id];
        const m = d.st
            ? new THREE.MeshStandardMaterial({ map: stripeTexture(d.c), roughness:.55, metalness:.05 })
            : new THREE.MeshStandardMaterial({ color:new THREE.Color(d.c), roughness:.55, metalness:.05 });
        wireMats[id] = m; return m;
    }
    function bgTexture() {
        const c = document.createElement('canvas'); c.width = c.height = 256;
        const g = c.getContext('2d');
        const grd = g.createLinearGradient(0,0,0,256);
        grd.addColorStop(0,'#101f33'); grd.addColorStop(1,'#070e19');
        g.fillStyle = grd; g.fillRect(0,0,256,256);
        g.strokeStyle = 'rgba(120,170,220,.08)'; g.lineWidth = 1;
        for (let i=0;i<=256;i+=32){g.beginPath();g.moveTo(i,0);g.lineTo(i,256);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(256,i);g.stroke();}
        const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3,3); return t;
    }
    function makeConnector() {
        const g = new THREE.Group();
        const clearM = new THREE.MeshStandardMaterial({ color:0xddeaf6, roughness:.22, metalness:.12, transparent:true, opacity:.72 });
        const goldM  = new THREE.MeshStandardMaterial({ color:0xd4a72c, roughness:.30, metalness:.92 });
        g.add(new THREE.Mesh(new THREE.BoxGeometry(.34,.42,.30), clearM));
        const latch = new THREE.Mesh(new THREE.BoxGeometry(.20,.10,.06), clearM); latch.position.set(0,-.26,.13); g.add(latch);
        for (let i=0;i<8;i++){ const p = new THREE.Mesh(new THREE.BoxGeometry(.022,.10,.014), goldM); p.position.set(-.12 + i*.034, .15, .155); g.add(p); }
        return g;
    }
    function makeCrimpMesh() {
        const g = new THREE.Group();
        const steel = new THREE.MeshStandardMaterial({ color:0xc8d2dc, roughness:.30, metalness:.85 });
        const red   = new THREE.MeshStandardMaterial({ color:0xdc2626, roughness:.60 });
        const up = new THREE.Mesh(new THREE.BoxGeometry(.30,.10,.28), steel); up.position.set(0,.14,0); g.add(up);
        const dn = new THREE.Mesh(new THREE.BoxGeometry(.30,.10,.28), steel); dn.position.set(0,-.14,0); g.add(dn);
        for (let i=0;i<4;i++){ const t = new THREE.Mesh(new THREE.BoxGeometry(.03,.06,.26), steel); t.position.set(-.09+i*.06,0,0); g.add(t); }
        const h1 = new THREE.Mesh(new THREE.BoxGeometry(.10,.42,.12), red); h1.position.set(-.19,-.46,0); h1.rotation.z=.15; g.add(h1);
        const h2 = new THREE.Mesh(new THREE.BoxGeometry(.10,.42,.12), red); h2.position.set(.19,-.46,0); h2.rotation.z=-.15; g.add(h2);
        return g;
    }
    function makeGloveMesh() {
        const g = new THREE.Group();
        const gm = new THREE.MeshStandardMaterial({ color:0xd93a3a, roughness:.72 });
        g.add(new THREE.Mesh(new THREE.BoxGeometry(.46,.32,.22), gm));
        for (let i=0;i<4;i++){ const f = new THREE.Mesh(new THREE.BoxGeometry(.09,.26,.19), gm); f.position.set(-.165 + i*.11, .28, 0); g.add(f); }
        return g;
    }
    function makeStripMesh() {
        const g = new THREE.Group();
        const blk = new THREE.MeshStandardMaterial({ color:0xeab308, roughness:.6 });
        g.add(new THREE.Mesh(new THREE.BoxGeometry(.34,.16,.20), blk));
        return g;
    }

    function init3D() {
        const hemat = save.l2.grafis === 'hemat';
        const q = hemat ? 1 : Math.min(window.devicePixelRatio || 1, 1.5);
        const rw = Math.max(2, Math.round(AW * q)), rh = Math.max(2, Math.round(AH * q));
        const renderer = new THREE.WebGLRenderer({ antialias:!hemat, preserveDrawingBuffer:true, powerPreference:'low-power' });
        renderer.setPixelRatio(1); renderer.setSize(rw, rh, false); renderer.setClearColor(0x0a1626,1);
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, AW/AH, .05, 80);

        scene.add(new THREE.AmbientLight(0xffffff, 0.72));
        const d1 = new THREE.DirectionalLight(0xffffff, 0.95); d1.position.set(1.2, 3, 5); scene.add(d1);
        const d2 = new THREE.DirectionalLight(0x8ec5ff, 0.35); d2.position.set(-2.5, 1, 2); scene.add(d2);

        const bgp = new THREE.Mesh(new THREE.PlaneGeometry(40,40), new THREE.MeshBasicMaterial({ map:bgTexture() }));
        bgp.position.set(0,0,-2.6); scene.add(bgp);
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(40,40), new THREE.MeshBasicMaterial({ color:0x060d18 }));
        floor.rotation.x = -Math.PI/2; floor.position.y = Y_BOT - 0.6; scene.add(floor);

        const grp = new THREE.Group(); scene.add(grp);
        const jMat = new THREE.MeshStandardMaterial({ color:0x64748b, roughness:.85, metalness:.05 });
        jacketM = new THREE.Mesh(new THREE.CylinderGeometry(JACK_R, JACK_R, 1, 20, 1, true), jMat); grp.add(jacketM);
        capTopM = new THREE.Mesh(new THREE.CircleGeometry(JACK_R, 20), jMat); capTopM.rotation.x = -Math.PI/2; grp.add(capTopM);
        capBotM = new THREE.Mesh(new THREE.CircleGeometry(JACK_R, 20), jMat); capBotM.rotation.x = Math.PI/2; grp.add(capBotM);

        ['A','B'].forEach(end => WIRE_IDS.forEach(id => {
            const m = new THREE.Mesh(new THREE.BufferGeometry(), wireMaterial(id));
            m.userData.end = end; m.userData.wireId = id; grp.add(m); wireM[end + '_' + id] = m;
        }));
        connA = makeConnector(); connA.visible = false; grp.add(connA);
        connB = makeConnector(); connB.visible = false; grp.add(connB);

        gloveG  = makeGloveMesh();  gloveG.visible  = false; scene.add(gloveG);
        cutterG = makeCrimpMesh();  cutterG.visible = false; scene.add(cutterG);
        stripG  = makeStripMesh();  stripG.visible  = false; scene.add(stripG);
        crimpG  = makeCrimpMesh();  crimpG.visible  = false; scene.add(crimpG);

        cutPiece = new THREE.Mesh(new THREE.CylinderGeometry(JACK_R, JACK_R, .30, 14),
            new THREE.MeshStandardMaterial({ color:0x505a66, roughness:.9 }));
        cutPiece.rotation.z = Math.PI/2; cutPiece.visible = false;
        cutPiece.position.set(-2.2, Y_BOT + .15, .6); scene.add(cutPiece);

        raycaster = new THREE.Raycaster();
        planeZ0 = new THREE.Plane(new THREE.Vector3(0,0,1), 0);
        R = { renderer, scene, camera, grp };
        setCam(-0.6, 9.5, 0, -0.6, 0, 0);
        rebuildWires();
    }
    function dispose3D() {
        if (!R) return;
        try {
            R.scene.traverse(o => {
                if (o.geometry) o.geometry.dispose();
                if (o.material) { const m = Array.isArray(o.material)?o.material:[o.material]; m.forEach(x=>{ if (x.map) x.map.dispose(); x.dispose(); }); }
            });
            R.renderer.dispose();
            if (R.renderer.domElement && R.renderer.domElement.parentNode) R.renderer.domElement.parentNode.removeChild(R.renderer.domElement);
        } catch(e){}
        R = null; wireM = {}; jacketM = capTopM = capBotM = null;
        gloveG = cutterG = stripG = crimpG = testerG = null; testerLED = [];
        connA = connB = cutPiece = null;
        for (const k in wireMats) delete wireMats[k];
        _texCache.clear();
    }
    lv.exit = function() { window.removeEventListener('keydown', dbgKey); dispose3D(); };

    const dbgKey = (e) => {
        if ((e.key === 'd' || e.key === 'D') && (!document.activeElement || document.activeElement.tagName !== 'INPUT')) {
            lv.debugMode = !lv.debugMode;
        }
    };
    window.addEventListener('keydown', dbgKey);

    function setCam(px,py,pz,lx,ly,lz, dur) {
        if (!R) return;
        camFrom = { p: R.camera.position.clone(), l: (R.camLook || new THREE.Vector3(0,0,0)).clone() };
        camTo = { p: new THREE.Vector3(px,py,pz), l: new THREE.Vector3(lx,ly,lz) };
        camT0 = performance.now(); camDur = dur == null ? 700 : dur;
        if (camDur === 0) { R.camera.position.copy(camTo.p); R.camLook = camTo.l.clone(); R.camera.lookAt(R.camLook); camTo = null; }
    }
    function camForStep(i) {
        const S = STEPS[i];
        if (!S) return { p:[0,-0.6,9.5], l:[0,-0.6,0] };
        if (S.end === 'AB') return { p:[0,-0.6,9.5], l:[0,-0.6,0] };
        if (S.end === 'A') {
            if (i <= 1) return { p:[0,-0.6,9.5], l:[0,-0.6,0] };
            const mid = tipA - STRIP_LEN * 0.5 + 0.15;
            return { p:[0, mid, 2.4], l:[0, mid, 0] };
        }
        const midB = tipB + STRIP_LEN * 0.5 - 0.15;
        return { p:[0, midB, 2.4], l:[0, midB, 0] };
    }
    function gotoCamForStep(i, dur) {
        const c = camForStep(i);
        setCam(c.p[0], c.p[1], c.p[2], c.l[0], c.l[1], c.l[2], dur);
    }

    function updateJacket() {
        if (!R) return;
        const jTop = KAB.ends.A.stripped ? (tipA - exA) : tipA;
        const jBot = KAB.ends.B.stripped ? (tipB + exB) : tipB;
        const len = Math.max(.2, jTop - jBot);
        jacketM.scale.set(1, len, 1);
        jacketM.position.y = jBot + len/2;
        capTopM.position.y = jTop;  capTopM.visible = !KAB.ends.A.stripped;
        capBotM.position.y = jBot;  capBotM.visible = !KAB.ends.B.stripped;
    }
    function rebuildWires() {
        if (!R) return;
        ['A','B'].forEach(end => {
            const e = KAB.ends[end];
            WIRE_IDS.forEach(id => {
                const mesh = wireM[end + '_' + id];
                if (!e.stripped) { mesh.visible = false; return; }
                mesh.visible = true;
                const idx = WIRE_IDS.indexOf(id);
                const ang = (idx/8) * Math.PI * 2;
                const bx = Math.cos(ang) * BUNDLE_R, bz = Math.sin(ang) * BUNDLE_R;
                const slot = e.slots.indexOf(id), fp = e.fan.indexOf(id);
                const tx = ((slot>=0 ? slot : fp) - 3.5) * 0.14;
                let jacketEdge, tip;
                if (end === 'A') { jacketEdge = tipA - exA; tip = tipA; }
                else { jacketEdge = tipB + exB; tip = tipB; }
                const curve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(bx, jacketEdge, bz),
                    new THREE.Vector3(bx*.65 + tx*.35, jacketEdge + (tip-jacketEdge)*.35, bz*.55),
                    new THREE.Vector3(bx*.25 + tx*.75, jacketEdge + (tip-jacketEdge)*.72, bz*.20),
                    new THREE.Vector3(tx, tip, 0)
                ]);
                mesh.geometry.dispose();
                mesh.geometry = new THREE.TubeGeometry(curve, 16, WIRE_R, 8, false);
            });
        });
    }

    function ndcFromPointer(p) { return { x: ((p.x-AX)/AW)*2-1, y: -((p.y-AY)/AH)*2+1 }; }
    function worldYAt(p) {
        if (!R) return 0;
        const n = ndcFromPointer(p);
        raycaster.setFromCamera(n, R.camera);
        const hit = new THREE.Vector3();
        if (!raycaster.ray.intersectPlane(planeZ0, hit)) return 0;
        return hit.y;
    }
    function pickWire(p) {
        if (!R) return null;
        const n = ndcFromPointer(p);
        raycaster.setFromCamera(n, R.camera);
        const end = STEPS[lv.step].end;
        const list = WIRE_IDS.map(id => wireM[end + '_' + id]).filter(m => m && m.visible);
        const hits = raycaster.intersectObjects(list, false);
        return hits.length ? hits[0].object.userData.wireId : null;
    }
    function projectY(localY) {
        if (!R) return AY + AH/2;
        const v = new THREE.Vector3(0, localY, 0).project(R.camera);
        return AY + (1 - (v.y + 1)/2) * AH;
    }

    const andi = (t, ms) => { lv.andi = t; lv.andiUntil = performance.now() + (ms || 4600); };
    const curStep = () => STEPS[lv.step];
    const fast = () => !!curStep().fast;
    const dur = (base) => fast() ? Math.round(base * .55) : base;

    function advanceStep() {
        if (lv.step >= STEPS.length - 1) return;
        lv.step++; lv.tool = null; lv.anim = null; lv.wireSel = null;
        const S = STEPS[lv.step];
        if (S.end === 'B' && KAB.flip < .5) {
            KAB.flip = 1;
            gotoCamForStep(lv.step, 900);
            andi('Sekarang pindah ke ujung B. Kupas, susun, ratakan, konektor, crimp — sama seperti ujung A tapi lebih cepat.');
        } else if (S.end === 'AB' && KAB.flip > .5) {
            gotoCamForStep(lv.step, 900);
            andi('Kedua ujung siap. Klik Tester di panel kanan, lalu klik area kerja untuk mulai uji.');
        } else {
            gotoCamForStep(lv.step, 700);
            const msg = {
                'glove':'Klik Sarung Tangan di panel kiri.',
                'cut':'Seret Pemotong Kabel melintang di garis 150 cm.',
                'stripA':'Seret Pengupas Kabel ke bawah ±1,2 cm dari ujung.',
                'orderA':'Klik kabel berwarna, lalu klik slot pin 1–8 sesuai T568B.',
                'trimA':'Seret Pemotong Kabel di antara dua garis ratakan.',
                'connA':'Klik Konektor RJ-45, lalu seret dari panel ke ujung kabel.',
                'crimpA':'Klik Tang Crimping, lalu tahan 0,3 detik pada konektor.',
                'stripB':'Ujung B: seret Pengupas Kabel seperti di ujung A.',
                'orderB':'Susun T568B di ujung B (pin 1 Putih-Oranye).',
                'trimB':'Ratakan ujung B seperti tadi.',
                'connB':'Pasang konektor RJ-45 di ujung B.',
                'crimpB':'Crimp ujung B.',
                'tester':'Kedua ujung ke tester. Amati 8 LED 1→8; merah berarti masalah.'
            }[S.id] || 'Lanjut.';
            andi(msg);
        }
        lv.wireDirty = true;
    }

    function actGlove() {
        if (lv.step !== 0 || KAB.glove) return;
        KAB.glove = true;
        gloveG.visible = true; gloveG.scale.setScalar(1);
        lv.anim = { type:'glove', t0:performance.now(), dur:1200 };
        SND.klik();
        say('Sarung tangan dipakai. Tangan terlindung dari serpihan kawat tajam.', 'ok');
        andi('Sarung tangan melindungi tangan dan menjaga kabel tetap bersih.');
        setTimeout(()=>{ if (lv.step===0) advanceStep(); }, 1260);
    }

    function doCut(localY) {
        let cm = yToCm(localY); if (Math.abs(cm - TARGET_CM) <= SNAP_CM) cm = TARGET_CM;
        if (Math.abs(cm - TARGET_CM) <= TOL_CM) {
            KAB.lengthCm = Math.round(cm); KAB.usedCm += KAB.lengthCm; KAB.cut = true;
            tipA = cmToY(cm);
            lv.anim = { type:'cut', t0:performance.now(), dur:dur(700), from:Y_TOP0, to:tipA };
            cutPiece.visible = true; SND.potong();
            say('Potongan rapi, panjang ' + KAB.lengthCm + ' cm.', 'ok');
            andi('150 cm sudah pas — tidak boros dan cukup untuk PC ke switch.');
            lv.wireDirty = true;
            setTimeout(()=>{ if (lv.step===1) advanceStep(); }, 900);
        } else if (cm > TARGET_CM) {
            KAB.usedCm += Math.round(cm);
            lv.penalize(8, 'Terlalu panjang (' + Math.round(cm) + ' cm) — sisa kabel terbuang.');
            andi('Kepanjangan. Sisa yang terbuang itu pemborosan bahan.');
            setTimeout(()=>{ lv.step=1; lv.tool=null; tipA=Y_TOP0; KAB.cut=false; lv.anim=null; lv.wireDirty=true; }, 1300);
        } else {
            KAB.usedCm += Math.round(cm);
            lv.penalize(10, 'Terlalu pendek (' + Math.round(cm) + ' cm) — kabel tidak cukup.');
            andi('Terlalu pendek. Ambil dari gulungan lagi.');
            setTimeout(()=>{ lv.step=1; lv.tool=null; tipA=Y_TOP0; KAB.cut=false; lv.anim=null; lv.wireDirty=true; }, 1300);
        }
    }

    function doStrip(end, lenWorld) {
        const e = KAB.ends[end];
        if (lenWorld < STRIP_LEN * .55) {
            lv.penalize(6, 'Kupasan terlalu pendek — jaket tidak lepas dari konduktor.');
            andi('Terlalu pendek. Kupas sekitar 1,2–1,5 cm supaya jaket lepas.');
            return;
        }
        if (lenWorld > STRIP_LEN * 1.75) {
            e.stripLen = STRIP_LEN * 1.4; e.stripped = true;
            lv.penalize(8, 'Terlalu dalam — konduktor tergores.');
            andi('Pisau masuk terlalu dalam sampai menyayat tembaga. Kabel seperti ini gagal uji.');
        } else {
            e.stripLen = STRIP_LEN; e.stripped = true;
            SND.kupas();
            say('Jaket terbuka rapi. Delapan konduktor muncul dengan urutan acak.', 'ok');
            andi('Bagus, jaketnya lepas bersih tanpa melukai tembaga di dalamnya.');
        }
        lv.wireDirty = true;
        setTimeout(()=>{ if (curStep().id.startsWith('strip')) advanceStep(); }, dur(860));
    }

    function placeWire(slot) {
        const end = curStep().end;
        const e = KAB.ends[end];
        const id = lv.wireSel;
        if (!id) { say('Klik dulu salah satu kabel berwarna di area kerja.', 'info'); return; }
        const old = e.slots.indexOf(id);
        if (old >= 0) e.slots[old] = null;
        if (e.slots[slot]) { const other = e.slots[slot]; e.slots[slot] = id; if (old>=0) e.slots[old] = other; }
        else e.slots[slot] = id;
        lv.wireSel = null; lv.wireDirty = true;
        SND.klik();
        if (e.slots.every(Boolean)) setTimeout(()=>checkOrder(end), 240);
    }
    function checkOrder(end) {
        const e = KAB.ends[end];
        if (!e.slots.every(Boolean)) { say('Masih ada slot pin yang kosong.', 'info'); return; }
        const wrong = [];
        e.slots.forEach((id, i) => { if (id !== T568B[i]) wrong.push(i+1); });
        if (!wrong.length) {
            SND.benar();
            say('Urutan T568B ujung ' + end + ' benar!', 'ok');
            andi('Sempurna! Urutan warnanya sudah persis T568B dari pin 1 sampai pin 8.');
            lv.score = Math.min(100, lv.score + 5);
            setTimeout(()=>{ if (curStep().id.startsWith('order')) advanceStep(); }, dur(1100));
        } else {
            lv.penalize(5, 'Urutan ujung ' + end + ' belum benar.');
            andi('Belum tepat di pin: ' + wrong.join(', ') + '. Ingat: PO-O-PH-B-PB-H-PC-C.');
        }
    }

    function doTrim(end, localY) {
        const e = KAB.ends[end];
        if (!e.slots.every(Boolean)) { say('Susun warna dulu sebelum meratakan.', 'info'); return; }
        const edge = end === 'A' ? (tipA - exA) : (tipB + exB);
        const dist = Math.abs(localY - edge);
        if (dist < TRIM_MIN * .5) { lv.penalize(4, 'Potongan terlalu dekat jaket — jaket bisa ikut terpotong.'); andi('Jangan mepet ke jaket. Sisakan sekitar 1,2–1,5 cm.'); return; }
        if (dist > TRIM_MAX * 2) { lv.penalize(6, 'Ujung terlalu panjang — tembaga tidak akan mencapai kontak RJ-45.'); andi('Terlalu panjang. Tembaga tidak akan menyentuh kontak konektor.'); return; }
        const want = clamp(dist, TRIM_MIN, TRIM_MAX);
        if (end === 'A') { tipA = edge + want; exA = want; } else { tipB = edge - want; exB = want; }
        e.trimmed = true;
        SND.potong();
        say('Ujung kabel sudah rata.', 'ok');
        andi('Bagus. Ujung rata seperti ini yang bikin tembaga pas menyentuh kontak.');
        lv.wireDirty = true;
        setTimeout(()=>{ if (curStep().id.startsWith('trim')) advanceStep(); }, dur(700));
    }

    function doConnector(end) {
        const e = KAB.ends[end];
        if (!e.trimmed) { say('Ratakan dulu ujung kabel sebelum memasang konektor.', 'info'); return; }
        const edge = end === 'A' ? (tipA - exA) : (tipB + exB);
        const tip = end === 'A' ? tipA : tipB;
        const stripToJacket = Math.abs(tip - edge);
        const jacketInside = e.trimmed;
        e.jacketIn = jacketInside;
        const G = end === 'A' ? connA : connB;
        G.visible = true;
        G.position.set(0, tip + (end === 'A' ? 0.6 : -0.6), 0.14);
        G.rotation.set(0, 0, end === 'A' ? 0 : Math.PI);
        const targetY = end === 'A' ? (tip - 0.15) : (tip + 0.15);
        lv.anim = { type:'conn', t0:performance.now(), dur:dur(600), end, from:G.position.y, to:targetY };
        SND.klik();
        if (jacketInside) {
            say('Konektor masuk. Jaket ikut masuk ke dalam konektor.', 'ok');
            andi('Jaket ikut masuk — nanti akan terjepit crimp sehingga sambungan kuat.');
            e.conn = 'inserted';
            KAB.rj45Used++;
            setTimeout(()=>{ if (curStep().id.startsWith('conn')) advanceStep(); }, dur(720));
        } else {
            e.conn = 'none'; e.trimmed = false;
            KAB.rj45Used++;
            lv.penalize(8, 'Tembaga tidak mencapai ujung konektor / jaket tidak masuk — konektor dibuang (RJ45 +1).');
            andi('Konektornya tidak duduk sempurna. Buang, ratakan ulang, lalu pasang konektor baru.');
            setTimeout(()=>{
                G.visible = false;
                const target = end === 'A' ? 'trimA' : 'trimB';
                while (STEPS[lv.step].id !== target && lv.step > 0) lv.step--;
                lv.tool = null; lv.anim = null; lv.wireDirty = true;
            }, 1200);
        }
    }

    function doCrimp(end) {
        const e = KAB.ends[end];
        if (e.conn !== 'inserted') { say('Pasang konektor dulu sebelum crimp.', 'info'); return; }
        e.crimped = true;
        lv.anim = { type:'shake', t0:performance.now(), dur:520, end };
        SND.crimp();

    function evaluateTest(now) {
        const bad = [];
        ['A','B'].forEach(end => {
            const e = KAB.ends[end];
            if (!e.crimped) bad.push(end + ': belum crimp');
            else if (e.slots.some((id, i) => id !== T568B[i])) bad.push(end + ': urutan T568B salah');
            else if (!e.jacketIn) bad.push(end + ': jaket tidak masuk');
        });
        lv.testBad = bad;
        if (!bad.length) {
            KAB.test.phase = 'ok'; KAB.test.okAt = now;
            say('Semua LED hijau. Kabel lulus uji!', 'ok');
            andi('Kabel lulus uji tester. Kedua ujung lolos, siap dipakai ke PC dan switch.');
            lv.score = Math.min(100, lv.score + 8);
            setTimeout(()=>{ lv.phase = 'deploy'; lv.deployT0 = performance.now(); lv.anim = null; }, 1500);
        } else {
            KAB.test.phase = 'fail';
            lv.penalize(10, 'Gagal uji — ' + bad.join(' | '));
            andi('Ada masalah: ' + bad.join(', ') + '. Perbaiki ujungnya, potong konektornya, ulangi.');
            KAB.rj45Used += 1;
            setTimeout(()=>{
                const first = bad[0].startsWith('A') ? 'A' : 'B';
                const e = KAB.ends[first];
                e.conn = 'none'; e.crimped = false; e.jacketIn = false; e.trimmed = false;
                (first === 'A' ? connA : connB).visible = false;
                KAB.flip = (first === 'B') ? 1 : 0;
                const target = first === 'A' ? 'trimA' : 'trimB';
                while (STEPS[lv.step].id !== target && lv.step > 0) lv.step--;
                lv.tool = null; lv.anim = null; KAB.test = null; lv.wireDirty = true;
            }, 1600);
        }
    }

    function render3D(now) {
        if (!R) return;
        if (camTo) {
            const p = camDur <= 0 ? 1 : Math.min(1, (now - camT0) / camDur);
            const e = p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2;
            R.camera.position.lerpVectors(camFrom.p, camTo.p, e);
            if (!R.camLook) R.camLook = new THREE.Vector3();
            R.camLook.lerpVectors(camFrom.l, camTo.l, e);
            R.camera.lookAt(R.camLook);
            if (p >= 1) camTo = null;
        }

        if (lv.anim && lv.anim.type === 'cut') {
            const p = Math.min(1, (now - lv.anim.t0) / lv.anim.dur);
            const e = 1 - Math.pow(1-p, 3);
            tipA = lv.anim.from + (lv.anim.to - lv.anim.from) * e;
            if (p >= 1) lv.anim = null;
            lv.wireDirty = true;
        }
        if (lv.anim && lv.anim.type === 'glove') {
            const p = Math.min(1, (now - lv.anim.t0) / lv.anim.dur);
            const x = p < 0.35 ? -2 + (p/0.35) * 1.6
                    : p < 0.55 ? -0.4
                    :            -0.4 + ((p-0.55)/0.45) * 2.2;
            gloveG.position.set(x, tipA - 0.4, 0.55);
            gloveG.rotation.y = Math.sin(now/300) * 0.25;
            if (p >= 1) {
                gloveG.visible = false;
                lv.anim = null;
            }
        }
        if (lv.anim && lv.anim.type === 'conn') {
            const p = Math.min(1, (now - lv.anim.t0) / lv.anim.dur);
            const e = 1 - Math.pow(1-p, 3);
            const G = lv.anim.end === 'A' ? connA : connB;
            G.position.y = lv.anim.from + (lv.anim.to - lv.anim.from) * e;
            if (p >= 1) lv.anim = null;
        }
        if (lv.anim && lv.anim.type === 'shake') {

            for (const d of devs) for (let k = 0; k < 3; k++) {
                const p = dotPos(d, k), sel = lv.sel && lv.sel.d === d && lv.sel.k === k;
                const hov = lv.phase === 'cable' && Math.hypot(mouse.x - p.x, mouse.y - p.y) < 11; if (hov) hoverBtn = true;
                ctx.beginPath(); ctx.arc(p.x, p.y, sel ? 8 : 6.5, 0, 6.3); ctx.fillStyle = d.used[k] ? '#e2e8f0' : (sel ? C.acc : '#0a1220'); ctx.fill();
                ctx.lineWidth = 2; ctx.strokeStyle = sel || hov ? C.acc : C.gold; ctx.stroke();
            }
        }
        if (lv.drag) drawDevice(lv.drag.d, mouse.x - lv.drag.offX, mouse.y - lv.drag.offY, .92);
        rr(700, 80, 242, 470, 14); ctx.fillStyle = C.panel; ctx.fill(); ctx.strokeStyle = C.line; ctx.lineWidth = 2; ctx.stroke();
        txt('Aturan rack', 718, 112, { s: 20, f: FONT_H, w: 600, c: C.acc });
        let y = 136;
        RULES.forEach((t, i) => {
            const st = lv.ruleOk ? (lv.ruleOk[i] ? 'ok' : 'bad') : 'idle';
            if (st === 'ok') tickIcon(724, y + 2, 12, C.ok); else if (st === 'bad') crossIcon(724, y + 2, 12, C.bad); else { ctx.beginPath(); ctx.arc(724, y + 2, 4, 0, 6.3); ctx.fillStyle = '#5f7389'; ctx.fill(); }
            const n = para(t, 742, y + 6, 186, 17, { s: 13, c: st === 'bad' ? '#fca5a5' : C.text }); y += n * 17 + 14;
        });
        if (lv.phase === 'place') {
            const all = devs.every(d => d.slot != null);
            para(all ? 'Semua perangkat sudah di rack. Periksa susunan.' : 'Seret kelima perangkat ke dalam rack.', 718, y + 16, 206, 18, { s: 13, c: C.mute });
            btn(716, 494, 210, 44, 'Cek Susunan Rack', checkRack, { color: C.ok, disabled: !all, s: 15 });
        } else {
            txt('Sambungan', 718, y + 22, { s: 20, f: FONT_H, w: 600, c: C.acc });
            LINKS.forEach((l, i) => {
                const yy = y + 52 + i * 30; const done = lv.links.some(k => k.key === [l[0], l[1]].sort().join('|'));
                if (done) tickIcon(724, yy - 4, 12, C.ok); else { ctx.beginPath(); ctx.arc(724, yy - 4, 4, 0, 6.3); ctx.fillStyle = '#5f7389'; ctx.fill(); }
                txt(l[2], 742, yy, { s: 13, c: done ? C.ok : C.text });
            });
            para('Klik satu port emas, lalu klik port di perangkat lain untuk memasang kabel.', 718, y + 186, 206, 18, { s: 13, c: C.mute });
        }
        if (lv.phase === 'quiz' || (lv.phase === 'fin' && lv.quiz)) drawQuiz(lv);
    };
    lv.down = function (p) {
        if (lv.phase === 'place') {
            for (let i = devs.length - 1; i >= 0; i--) {
                const d = devs[i], r = devRect(d);
                if (inR(p, r)) { lv.drag = { d, offX: p.x - r.x, offY: p.y - r.y, prev: d.slot }; d.slot = null; return; }
            }
        } else if (lv.phase === 'cable') {
            for (const d of devs) for (let k = 0; k < 3; k++) { const q = dotPos(d, k); if (Math.hypot(p.x - q.x, p.y - q.y) < 12) { clickDot(d, k); return; } }
            lv.sel = null;
        }
    };
    lv.up = function () {
        if (!lv.drag) return; const d = lv.drag.d, prev = lv.drag.prev;
        const s = snap(d);
        if (s != null) {
            if (free(d, s)) { d.slot = s; lv.ruleOk = null; }
            else { d.slot = prev; say('Slot bertabrakan dengan perangkat lain.', 'info'); }
        } else d.slot = null;
        lv.drag = null;
    };
    return lv;
}
