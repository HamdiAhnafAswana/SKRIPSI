<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NetCrimp — Simulasi Instalasi &amp; Pengkabelan Jaringan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf0f7;--fg:#13202f;--muted:#57687b;--card:#fff;--line:#cfd9e5;--accent:#0b7bb5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a121d;--fg:#e6eef7;--muted:#93a6ba;--card:#111d2c;--line:#22344a;--accent:#38bdf8}}
:root[data-theme="dark"]{--bg:#0a121d;--fg:#e6eef7;--muted:#93a6ba;--card:#111d2c;--line:#22344a;--accent:#38bdf8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:12px 12px 20px}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600;font-size:19px;margin:0;letter-spacing:.2px}
h1 small{display:block;font-family:'Nunito',system-ui,sans-serif;font-weight:600;font-size:12.5px;color:var(--muted);letter-spacing:0}
.who{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--muted)}
.who input{font:inherit;font-weight:700;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:210px;max-width:52vw}
.who input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
canvas{display:block;width:100%;height:auto;aspect-ratio:960/600;border-radius:14px;border:1px solid var(--line);background:#0c1726;touch-action:none;user-select:none;-webkit-user-select:none}
.note{margin:10px 2px 0;font-size:13px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>NetCrimp<small>Game edukasi instalasi &amp; pengkabelan jaringan untuk siswa SMK TKJ</small></h1>
<label class="who">Nama siswa <input id="nama" type="text" maxlength="30" placeholder="Isi sebelum bermain" autocomplete="off"></label>
</header>
<canvas id="c" width="960" height="600" aria-label="Area permainan NetCrimp"></canvas>
<p class="note">Kontrol: seret dan lepas dengan mouse atau sentuhan. Progres dan log hasil tersimpan di browser ini.</p>
</div>
<script>
(() => {
'use strict';

@@BUILD:CORE@@

@@BUILD:LEVELS@@

@@BUILD:UI@@

})();
</script>
</body>
</html>
