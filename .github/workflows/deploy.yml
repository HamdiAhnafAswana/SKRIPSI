name: Deploy SINOVA ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Izin resmi yang dibutuhkan GitHub Pages (build + deploy via OIDC).
permissions:
  contents: read
  pages: write
  id-token: write

# Satu deployment sekaligus; jangan batalkan deployment yang sedang berjalan.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cek variabel build wajib
        # Gagal cepat bila variabel publik belum diset, supaya tidak
        # menerbitkan build tanpa konfigurasi (penyebab halaman kosong).
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Repository variables VITE_SUPABASE_URL dan/atau VITE_SUPABASE_ANON_KEY belum diset."
            echo "Setel di Settings → Secrets and variables → Actions → Variables (tab Variables)."
            exit 1
          fi

      - name: Build (Vite)
        run: npm run build
        env:
          # Nilai PUBLIK (URL proyek + anon/publishable key) — bukan secret server.
          # Disetel di: Settings → Secrets and variables → Actions → Variables.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SINOVA_ADMIN_API: ${{ vars.VITE_SINOVA_ADMIN_API }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
